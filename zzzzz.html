<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko the Fox Dog - Final Fix</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Niko is Solid!</h1>
        <p>Lead him with your cursor.</p>
    </div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, mixer, clock, model;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let targetPosition = new THREE.Vector3(0, 0, 0);

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();

        // --- Camera & Lights ---
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        const grid = new THREE.GridHelper(100, 40, 0x333333, 0x222222);
        scene.add(grid);

        // --- Load & Fix Niko ---
        const loader = new GLTFLoader();
        loader.load('niko.glb', (gltf) => {
            model = gltf.scene;

            model.traverse((child) => {
                if (child.isMesh) {
                    // This section fixes the "See-Through" issue shown in your screenshots
                    child.material.side = THREE.FrontSide; // Only render the outside
                    child.material.depthWrite = true;      // Ensure it blocks things behind it
                    child.material.depthTest = true;       // Check if something is in front
                    child.material.transparent = false;    // Turn off transparency
                    child.material.alphaTest = 0.5;        // Solidify edges
                }
            });

            scene.add(model);

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(gltf.animations[0]).play();
            }
        });

        // --- Renderer ---
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model) {
            // Find floor intersection
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPosition);

            const lookTarget = new THREE.Vector3(targetPosition.x, model.position.y, targetPosition.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 0.3) {
                // Rotate and walk
                const lookAtQuaternion = new THREE.Quaternion();
                const dummy = new THREE.Object3D();
                dummy.position.copy(model.position);
                dummy.lookAt(lookTarget);
                lookAtQuaternion.copy(dummy.quaternion);

                model.quaternion.slerp(lookAtQuaternion, 0.1);
                model.translateZ(0.08);
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
