<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: Final Attempt</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .log { color: #888; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="status">CONNECTING TO NIKO...</div>
        <div id="log-box" class="log"></div>
    </div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    const status = document.getElementById('status');
    const logBox = document.getElementById('log-box');

    function addLog(msg) { logBox.innerHTML += `> ${msg}<br>`; }

    // 1. Loading Manager
    const manager = new THREE.LoadingManager();
    manager.onStart = (url) => addLog(`Loading: ${url}`);
    manager.onLoad = () => {
        addLog("All files parsed successfully.");
        document.getElementById('overlay').style.display = 'none';
    };
    manager.onError = (url) => {
        status.innerHTML = "<span style='color:red'>LOAD FAILED</span>";
        addLog(`FAILED TO READ: ${url}. (Check if Binary FBX)`);
    };

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(200, 300, 500);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
        scene.add(new THREE.GridHelper(2000, 50, 0x333333, 0x222222));

        const loader = new FBXLoader(manager);

        // Load Catwalk First
        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            const walkClip = fbx.animations[0];
            fixTracks(walkClip);
            actions['walk'] = mixer.clipAction(walkClip);

            // Load Idle Second
            loader.load('idle.fbx', (idleFbx) => {
                const idleClip = idleFbx.animations[0];
                fixTracks(idleClip);
                actions['idle'] = mixer.clipAction(idleClip);

                activeAction = actions['idle'];
                activeAction.play();
            });
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function fixTracks(clip) {
        if (!clip) return;
        clip.tracks.forEach(track => {
            // This is the "Zombie Fix" - it strips mixamorig prefixes
            track.name = track.name.replace(/mixamorig[0-9]*_?|.*:/g, "");
        });
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const lookTarget = new THREE.Vector3(targetPos.x, model.position.y, targetPos.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 40) { // Check if distance is too small for FBX units
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(5);
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
