<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: The Rescue</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: #0f0; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <div id="status">RESCUING NIKO FROM THE VOID...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model, walkAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // Wide camera view
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 400, 800);
        camera.lookAt(0, 0, 0);

        // Blasting lights
        scene.add(new THREE.AmbientLight(0xffffff, 4));
        const sun = new THREE.DirectionalLight(0xffffff, 4);
        sun.position.set(500, 1000, 500);
        scene.add(sun);

        // Large grid to help us spot him
        scene.add(new THREE.GridHelper(5000, 100, 0x00ff00, 0x444444));

        const loader = new FBXLoader();

        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;

            // --- THE ABSOLUTE SCALE FORCE ---
            // If scale is 0, we force it to 1. If it's too small, we boost it.
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());

            // If the model reports 0 height, we force a massive scale multiplier
            let forceScale = 1;
            if (size.y < 0.1) {
                forceScale = 100; // Assuming it's microscopic
            } else {
                forceScale = 200 / size.y; // Standardize to 200 units tall
            }

            model.scale.setScalar(forceScale);
            model.position.set(0, 0, 0); // Force him to the center of the grid
            scene.add(model);

            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];
                clip.tracks.forEach(t => t.name = t.name.replace(/.*[:_]/, ""));
                walkAction = mixer.clipAction(clip);
                walkAction.play();
                document.getElementById('status').innerHTML = "NIKO IS BACK. LEAD HIM.";
            }
        }, (xhr) => {
            console.log((xhr.loaded / xhr.total * 100) + '% loaded');
        }, (err) => {
            document.getElementById('status').innerHTML = "ERROR: CATWALK.FBX FAILED";
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && walkAction) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 50) {
                walkAction.paused = false;
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(6);
            } else {
                walkAction.paused = true;
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
