<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko's Meadow: Final Fix</title>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px black; z-index: 10; background: rgba(0,0,0,0.5); padding: 5px; }
    </style>
</head>
<body>
    <div id="status">MEASURING NIKO...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model, walkAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        // Camera: Farther back to ensure we see the "Giant" if he's still huge
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 800, 2000);

        scene.add(new THREE.AmbientLight(0xffffff, 3));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(500, 1000, 500);
        scene.add(sun);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(10000, 10000),
            new THREE.MeshPhongMaterial({ color: 0x2d5a27 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const loader = new FBXLoader();

        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;

            // --- THE MATHEMATICAL FIX ---
            // 1. Calculate how big he actually is right now
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());

            // 2. Force him to be exactly 200 units tall
            const targetHeight = 200;
            const currentHeight = size.y || 1;
            const finalScale = targetHeight / currentHeight;

            model.scale.setScalar(finalScale);
            model.position.set(0, 0, 0);
            scene.add(model);

            // 3. Add a Helper so we can see his boundaries
            const helper = new THREE.BoxHelper(model, 0xff0000);
            scene.add(helper);

            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];
                clip.tracks.forEach(t => t.name = t.name.replace(/.*[:_]/, ""));
                walkAction = mixer.clipAction(clip);
                walkAction.play();
                document.getElementById('status').innerHTML = `NIKO HEIGHT: ${targetHeight} | SCALE MULTIPLIER: ${finalScale.toFixed(4)}`;
            }
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && walkAction) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 50) {
                walkAction.paused = false;
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(10);
            } else {
                walkAction.paused = true;
            }
            // Keep camera focused on the red box area
            camera.lookAt(model.position);
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
