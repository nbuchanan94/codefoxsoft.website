<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: Dual GLB System</title>
    <style>
        body { margin: 0; background: #0b0b0b; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; color: #00ff88; font-family: monospace; }
    </style>
</head>
<body>
    <div id="loading">VIBE CHECKING NIKO...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        scene.add(new THREE.GridHelper(100, 50, 0x333333, 0x222222));

        const loader = new GLTFLoader();

        // 1. Load the Catwalk model (The Body + Walk Anim)
        loader.load('catwalk.glb', (gltf) => {
            model = gltf.scene;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            // Store the Walk animation found in catwalk.glb
            if (gltf.animations.length > 0) {
                actions['walk'] = mixer.clipAction(gltf.animations[0]);
            }

            // 2. Load the Idle animation file
            loader.load('idle.glb', (idleGltf) => {
                if (idleGltf.animations.length > 0) {
                    // We take the animation from idle.glb and apply it to our main mixer
                    actions['idle'] = mixer.clipAction(idleGltf.animations[0]);

                    // Start in Idle
                    activeAction = actions['idle'];
                    activeAction.play();
                }
                document.getElementById('loading').style.display = 'none';
            });
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    // Smoothly blends between animations
    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        const nextAction = actions[name];
        nextAction.reset().fadeIn(0.4).play();
        activeAction.fadeOut(0.4);
        activeAction = nextAction;
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const lookTarget = new THREE.Vector3(targetPos.x, model.position.y, targetPos.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 0.8) {
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(0.1); // Adjust for catwalk speed
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
