<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko Debugger</title>
    <style>
        body { margin: 0; background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
        #debug-log { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="debug-log">SYSTEM STARTING...<br></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    const log = (msg) => {
        document.getElementById('debug-log').innerHTML += msg + "<br>";
        console.log(msg);
    };

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(100, 200, 300);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
        scene.add(new THREE.GridHelper(1000, 20, 0x333333, 0x222222));

        const loader = new FBXLoader();

        log("Attempting to load catwalk.fbx...");
        loader.load('catwalk.fbx', (fbx) => {
            log("SUCCESS: catwalk.fbx loaded.");
            model = fbx;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            const walkClip = fbx.animations[0];
            fixTracks(walkClip);
            actions['walk'] = mixer.clipAction(walkClip);

            log("Attempting to load idle.fbx...");
            loader.load('idle.fbx', (idleFbx) => {
                log("SUCCESS: idle.fbx loaded.");
                const idleClip = idleFbx.animations[0];
                fixTracks(idleClip);
                actions['idle'] = mixer.clipAction(idleClip);

                activeAction = actions['idle'];
                activeAction.play();
                log("Niko is ready. Move your mouse.");
            }, (xhr) => {
                // Progress tracker
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    if (percent % 20 === 0) log(`Idle loading: ${percent}%`);
                }
            }, (err) => {
                log("ERROR: Could not load idle.fbx. Check file name/path.");
                console.error(err);
            });
        }, (xhr) => {
            if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if (percent % 20 === 0) log(`Catwalk loading: ${percent}%`);
            }
        }, (err) => {
            log("ERROR: Could not load catwalk.fbx. Check file name/path.");
            console.error(err);
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function fixTracks(clip) {
        if (!clip) return;
        clip.tracks.forEach(track => {
            track.name = track.name.replace(/mixamorig[0-9]*_?|.*:/g, "");
        });
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.3).play();
        activeAction.fadeOut(0.3);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const lookTarget = new THREE.Vector3(targetPos.x, model.position.y, targetPos.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 20) {
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(3);
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
