<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko the Fox Dog - Follow Cursor</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(#333, #000);
            overflow: hidden;
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Niko is Following You</h1>
        <p>Move your mouse to lead the way</p>
    </div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, mixer, clock, model;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let targetPosition = new THREE.Vector3(0, 0, 0);

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();

        // --- Camera Setup ---
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 15); // Bird's eye view to see the walking better

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        // --- Ground & Visual Aids ---
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(grid);

        // --- Load Niko ---
        const loader = new GLTFLoader();
        loader.load('niko.glb', (gltf) => {
            model = gltf.scene;

            // Fix transparency/see-through issues
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material.side = THREE.DoubleSide;
                    child.material.depthWrite = true;
                    child.material.transparent = false;
                    child.material.alphaTest = 0.5; // Helps with fur edges if they exist
                }
            });

            scene.add(model);

            // Start Walk Animation
            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }
        });

        // --- Renderer ---
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2, 0);

        // --- Mouse Tracking ---
        window.addEventListener('mousemove', (event) => {
            // Converts mouse position to -1 to +1 range for Three.js
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', onWindowResize);

        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model) {
            // 1. Raycast to find the ground point under the mouse
            raycaster.setFromCamera(mouse, camera);
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(groundPlane, targetPosition);

            // 2. Make Niko face the target (y stays same so he doesn't tilt up/down)
            const lookTarget = new THREE.Vector3(targetPosition.x, model.position.y, targetPosition.z);

            // Check distance so he doesn't jitter when he reaches the mouse
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 0.5) {
                // Smoothly rotate toward target
                const originalRot = model.quaternion.clone();
                model.lookAt(lookTarget);
                const targetRot = model.quaternion.clone();
                model.quaternion.copy(originalRot);
                model.quaternion.slerp(targetRot, 0.1); // Smooth rotation

                // Move forward (Speed is 0.05, change to make him faster)
                model.translateZ(0.08);
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
