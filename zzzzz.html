<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko: Catwalk to Idle</title>
    <style>
        body { margin: 0; background-color: #050505; overflow: hidden; font-family: sans-serif; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: #0f0;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">Syncing Animations...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(100, 200, 300);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 200, 100);
        scene.add(light);

        const loader = new FBXLoader();

        // 1. Load Catwalk (Main Body)
        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;
            model.scale.setScalar(1); // Adjust if he is giant/tiny
            scene.add(model);

            mixer = new THREE.AnimationMixer(model);

            // Fix the walk track names
            const walkClip = fbx.animations[0];
            fixTracks(walkClip);
            actions['walk'] = mixer.clipAction(walkClip);

            // 2. Load Idle (Animation Only)
            loader.load('idle.fbx', (idleFbx) => {
                const idleClip = idleFbx.animations[0];
                fixTracks(idleClip);
                actions['idle'] = mixer.clipAction(idleClip);

                // Start with Idle
                activeAction = actions['idle'];
                activeAction.play();

                document.getElementById('loading-overlay').style.display = 'none';
            });
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    // This handles the Mixamo/Accurig prefix naming issue
    function fixTracks(clip) {
        clip.tracks.forEach(track => {
            track.name = track.name.replace(/mixamorig[0-9]*_?|.*:/g, "");
        });
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.3).play();
        activeAction.fadeOut(0.3);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const lookTarget = new THREE.Vector3(targetPos.x, model.position.y, targetPos.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 15) { // Threshold for walking
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(2.5); // Speed for FBX units
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
