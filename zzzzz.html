<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko: Bone Fix Edition</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), targetPosition = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        scene.add(new THREE.GridHelper(100, 50, 0x333333, 0x111111));

        const gltfLoader = new GLTFLoader();
        const fbxLoader = new FBXLoader();

        gltfLoader.load('niko.glb', (gltf) => {
            model = gltf.scene;
            model.traverse(n => { if(n.isMesh) { n.material.side = THREE.FrontSide; n.material.depthWrite = true; } });
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            // Load animations and fix bone names
            loadAnim(fbxLoader, 'walk.fbx', 'walk');
            loadAnim(fbxLoader, 'angry.fbx', 'angry', true);
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function loadAnim(loader, url, name, isDefault = false) {
        loader.load(url, (fbx) => {
            const clip = fbx.animations[0];

            // --- THE FIX: Strip prefixes from bone tracks ---
            clip.tracks.forEach(track => {
                // This converts "mixamorig_Hips.position" to "Hips.position"
                // It also fixes internal FBX naming like "Object_0.bones[Hips].position"
                track.name = track.name.replace(/.*[:_]/, "");
            });

            actions[name] = mixer.clipAction(clip);
            if (isDefault) {
                activeAction = actions[name];
                activeAction.play();
            }
        });
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['angry']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPosition);

            const lookTarget = new THREE.Vector3(targetPosition.x, model.position.y, targetPosition.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 1.5) {
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(0.08);
            } else {
                fadeTo('angry');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
