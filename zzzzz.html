        #status { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #00ff00; pointer-events: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="status">Loading Niko and his moods...</div>

<script type="importmap">

        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {};
    let activeAction;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let targetPosition = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        scene.add(new THREE.GridHelper(100, 50, 0x333333, 0x111111));

        const gltfLoader = new GLTFLoader();
        const fbxLoader = new FBXLoader();

        // 1. Load the textured Niko
        gltfLoader.load('niko.glb', (gltf) => {
            model = gltf.scene;

            // Fix transparency/depth issues from before
            model.traverse(n => {
                if(n.isMesh) {
                    n.material.side = THREE.FrontSide;
                    n.material.transparent = false;
                    n.material.depthWrite = true;
                }
            });

            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            // 2. Load the "Motion-Only" Walk
            fbxLoader.load('walk.fbx', (anim) => {
                const clip = anim.animations[0];
                clip.name = "walk";
                actions['walk'] = mixer.clipAction(clip);
                console.log("Walk animation loaded");
            });

            // 3. Load the "Motion-Only" Angry
            fbxLoader.load('angry.fbx', (anim) => {
                const clip = anim.animations[0];
                clip.name = "angry";
                actions['angry'] = mixer.clipAction(clip);

                // Start in Angry state
                activeAction = actions['angry'];
                activeAction.play();
                document.getElementById('status').innerHTML = "LEAD NIKO WITH YOUR CURSOR";
            });
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    // Smoothly transitions between animations
    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;

        const nextAction = actions[name];
        nextAction.reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = nextAction;
    }

        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
