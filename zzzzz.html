<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: FBX Restored</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">INITIALIZING FBX SYSTEM...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    const statusEl = document.getElementById('status');
    const log = (m) => { statusEl.innerHTML += `<br>> ${m}`; console.log(m); };

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        // Camera set wide because FBX models can be huge
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(200, 300, 500);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
        scene.add(new THREE.GridHelper(2000, 50, 0x333333, 0x222222));

        const loader = new FBXLoader();

        log("Loading catwalk.fbx (Body)...");
        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;
            model.scale.setScalar(1); // Adjust if he is tiny or giant
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const walkClip = fbx.animations[0];
                cleanAnimationNames(walkClip);
                actions['walk'] = mixer.clipAction(walkClip);
                log("Walk motion ready.");
            }

            log("Loading idle.fbx (Motion)...");
            loader.load('idle.fbx', (idleFbx) => {
                if (idleFbx.animations.length > 0) {
                    const idleClip = idleFbx.animations[0];
                    cleanAnimationNames(idleClip);
                    actions['idle'] = mixer.clipAction(idleClip);

                    activeAction = actions['idle'];
                    activeAction.play();
                    log("Idle motion ready.");
                }
                log("SYSTEM ONLINE. Move mouse.");
            }, undefined, (e) => log("ERROR: idle.fbx missing or corrupted."));

        }, (xhr) => {
            if (xhr.lengthComputable) {
                const percent = Math.round(xhr.loaded / xhr.total * 100);
                statusEl.innerHTML = `DOWNLOADING NIKO: ${percent}%`;
            }
        }, (e) => log("ERROR: catwalk.fbx not found."));

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    // THIS IS THE CRITICAL PART:
    // It strips prefixes like "mixamorig:" so animations can find the bones
    function cleanAnimationNames(clip) {
        clip.tracks.forEach(track => {
            track.name = track.name.replace(/mixamorig[0-9]*_?|.*:/g, "");
        });
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 30) { // FBX units are usually larger
                fadeTo('walk');
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(4); // Movement speed
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
