<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: GLB Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; color: #0f0; }
    </style>
</head>
<body>
    <div id="loading">LOADING NIKO...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        scene.add(new THREE.GridHelper(100, 50, 0x444444, 0x222222));

        const loader = new GLTFLoader();

        // 1. Load Main Model (Catwalk)
        loader.load('catwalk.glb', (gltf) => {
            model = gltf.scene;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            // Store the Walk animation
            const walkClip = gltf.animations[0];
            actions['walk'] = mixer.clipAction(walkClip);

            // 2. Load Idle Animation from the other file
            loader.load('idle.glb', (idleGltf) => {
                const idleClip = idleGltf.animations[0];
                actions['idle'] = mixer.clipAction(idleClip);

                // Start with Idle
                activeAction = actions['idle'];
                activeAction.play();

                document.getElementById('loading').style.display = 'none';
            });
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && actions['walk'] && actions['idle']) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const lookTarget = new THREE.Vector3(targetPos.x, model.position.y, targetPos.z);
            const distance = model.position.distanceTo(lookTarget);

            if (distance > 1.0) {
                fadeTo('walk');
                model.lookAt(lookTarget);
                model.translateZ(0.08); // Speed for GLB (usually meters)
            } else {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
