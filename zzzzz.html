<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: Just Walk</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: #0f0; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">LOADING NIKO...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model, walkAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(200, 300, 600);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        scene.add(new THREE.GridHelper(2000, 50, 0x333333, 0x222222));

        const loader = new FBXLoader();

        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];
                // Strip bone prefixes to ensure it plays
                clip.tracks.forEach(t => t.name = t.name.replace(/.*[:_]/, ""));

                walkAction = mixer.clipAction(clip);
                walkAction.play();
                document.getElementById('status').innerHTML = "NIKO READY: LEAD THE WAY";
            }
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && walkAction) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 40) {
                walkAction.paused = false; // Keep walking
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(5);
            } else {
                walkAction.paused = true; // Stop walking when close
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
