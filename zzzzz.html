<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: Self-Healing Loader</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">CHECKING FILES...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    let actions = {}, activeAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    const statusEl = document.getElementById('status');
    const log = (m) => { statusEl.innerHTML += `<br>> ${m}`; console.log(m); };

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        scene.add(new THREE.GridHelper(100, 50, 0x333333, 0x222222));

        const loader = new GLTFLoader();

        log("Loading catwalk.glb...");
        loader.load('catwalk.glb', (gltf) => {
            model = gltf.scene;
            scene.add(model);
            mixer = new THREE.AnimationMixer(model);

            if (gltf.animations.length > 0) {
                actions['walk'] = mixer.clipAction(gltf.animations[0]);
                log("Walk animation found.");
            } else {
                log("WARN: No animation in catwalk.glb");
            }

            log("Loading idle.glb...");
            loader.load('idle.glb', (idleGltf) => {
                if (idleGltf.animations.length > 0) {
                    actions['idle'] = mixer.clipAction(idleGltf.animations[0]);
                    log("Idle animation found.");
                    activeAction = actions['idle'];
                    activeAction.play();
                } else {
                    log("WARN: No animation in idle.glb");
                    // Fallback to walk if idle is missing
                    if(actions['walk']) { activeAction = actions['walk']; activeAction.play(); }
                }
                log("READY. Move mouse to walk.");
                setTimeout(() => { statusEl.style.opacity = "0.3"; }, 3000);
            }, undefined, (e) => log("ERROR: idle.glb failed to load."));

        }, undefined, (e) => log("ERROR: catwalk.glb failed to load. Check file names."));

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function fadeTo(name) {
        if (!actions[name] || activeAction === actions[name]) return;
        actions[name].reset().fadeIn(0.5).play();
        activeAction.fadeOut(0.5);
        activeAction = actions[name];
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 1.0 && actions['walk']) {
                fadeTo('walk');
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(0.1);
            } else if (actions['idle']) {
                fadeTo('idle');
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
