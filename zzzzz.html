<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko's Meadow: Fixed</title>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px black; z-index: 10; background: rgba(0,0,0,0.3); padding: 5px; }
    </style>
</head>
<body>
    <div id="status">LOCATING NIKO IN THE TALL GRASS...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model, walkAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 500, 3000);

        // High-angle camera to start
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(0, 500, 1000);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(100, 500, 100);
        scene.add(sun);

        // Green Grass Floor (The "Meadow")
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(10000, 10000),
            new THREE.MeshPhongMaterial({ color: 0x2d5a27 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1; // Slightly below zero so Niko stands ON it
        scene.add(ground);

        const loader = new FBXLoader();

        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;

            // --- THE VISIBILITY RESCUE ---
            // 1. Force Scale (Boosted to 15 since he was microscopic)
            model.scale.setScalar(15);

            // 2. Force Position (Stand him on the grass)
            model.position.set(0, 0, 0);

            scene.add(model);

            // 3. Focus Camera on him
            camera.lookAt(model.position);

            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];
                clip.tracks.forEach(t => t.name = t.name.replace(/.*[:_]/, ""));
                walkAction = mixer.clipAction(clip);
                walkAction.play();
                document.getElementById('status').innerHTML = "NIKO IS ON THE GRASS";
            }
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && walkAction) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            // If mouse is far, walk to it
            if (distance > 50) {
                walkAction.paused = false;
                model.lookAt(targetPos.x, model.position.y, targetPos.z);
                model.translateZ(8);

                // Dynamic Camera: follow the homie
                camera.position.x += (model.position.x - camera.position.x) * 0.05;
                camera.position.z += ((model.position.z + 800) - camera.position.z) * 0.05;
                camera.lookAt(model.position);
            } else {
                walkAction.paused = true;
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
