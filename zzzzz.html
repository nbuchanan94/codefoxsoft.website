<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: FBX Test</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 100; }
    </style>
</head>
<body>
    <div id="status">ATTEMPTING TO LOAD CATWALK.FBX...</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model;
    const statusEl = document.getElementById('status');

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(500, 500, 500);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(100, 200, 100);
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(5000, 50, 0x444444, 0x222222));

        const loader = new FBXLoader();

        loader.load('catwalk.fbx', (fbx) => {
            statusEl.innerHTML = "FILE LOADED. ANALYZING ANIMATION...";
            model = fbx;
            scene.add(model);

            // 1. Auto-Center and Zoom Camera
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3()).length();
            const center = box.getCenter(new THREE.Vector3());
            camera.position.set(center.x, center.y + (size / 1.5), center.z + size);
            camera.lookAt(center);

            // 2. Setup Mixer
            mixer = new THREE.AnimationMixer(model);

            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];

                // 3. The "Brute Force" Bone Fix
                // This strips every possible prefix so the motion finds the bones
                clip.tracks.forEach(track => {
                    track.name = track.name.replace(/mixamorig[0-9]*_?|.*:/g, "");
                });

                const action = mixer.clipAction(clip);
                action.play();
                statusEl.innerHTML = "SUCCESS: ANIMATION PLAYING";
            } else {
                statusEl.innerHTML = "ERROR: NO ANIMATION TRACKS FOUND IN FBX";
            }

        }, (xhr) => {
            const p = Math.round(xhr.loaded / xhr.total * 100);
            statusEl.innerHTML = `LOADING: ${p}%`;
        }, (err) => {
            statusEl.innerHTML = "CRITICAL ERROR: COULD NOT FIND catwalk.fbx";
            console.error(err);
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
