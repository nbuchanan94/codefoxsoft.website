<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko: Smooth Meadow</title>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px black; z-index: 10; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="status">SCROLL TO ZOOM | NIKO IS READY</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    let scene, camera, renderer, mixer, clock, model, walkAction;
    let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster(), targetPos = new THREE.Vector3();
    let zoomDist = 1200; // Starting zoom distance

    init();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 1000, 5000);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 30000);
        camera.position.set(0, 600, zoomDist);

        scene.add(new THREE.AmbientLight(0xffffff, 2.5));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(500, 1000, 500);
        scene.add(sun);

        // Meadow
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20000, 20000),
            new THREE.MeshPhongMaterial({ color: 0x2d5a27 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const loader = new FBXLoader();
        loader.load('catwalk.fbx', (fbx) => {
            model = fbx;

            // Apply that massive 14869x scale factor automatically
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const scaleFactor = 250 / (size.y || 1);
            model.scale.setScalar(scaleFactor);

            scene.add(model);

            mixer = new THREE.AnimationMixer(model);
            if (fbx.animations.length > 0) {
                const clip = fbx.animations[0];
                clip.tracks.forEach(t => t.name = t.name.replace(/.*[:_]/, ""));
                walkAction = mixer.clipAction(clip);
                walkAction.play();
                walkAction.paused = true; // Stay still until mouse moves
            }
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- CONTROLS ---
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('wheel', (e) => {
            zoomDist += e.deltaY * 0.5;
            zoomDist = Math.max(300, Math.min(zoomDist, 5000)); // Clamp zoom
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (model && walkAction) {
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.ray.intersectPlane(plane, targetPos);

            const distance = model.position.distanceTo(targetPos);

            if (distance > 30) {
                walkAction.paused = false;

                // 1. SMOOTH ROTATION (Look at target gradually)
                const targetRotation = Math.atan2(targetPos.x - model.position.x, targetPos.z - model.position.z);
                model.rotation.y = THREE.MathUtils.lerp(model.rotation.y, targetRotation, 0.1);

                // 2. SMOOTH MOVEMENT
                model.translateZ(6);

                // 3. SMOOTH CAMERA FOLLOW
                const camTargetY = 400 + (zoomDist * 0.2);
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, model.position.x, 0.05);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, model.position.z + zoomDist, 0.05);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, camTargetY, 0.05);
                camera.lookAt(model.position.x, 150, model.position.z);
            } else {
                walkAction.paused = true;
            }
        }
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
